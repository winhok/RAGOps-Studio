name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic backend tests
        run: |
          cd backend
          PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Run bundled evaluation benchmark
        run: python backend/scripts/seed_and_eval.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: |
          cd frontend
          npm install
          npm run build

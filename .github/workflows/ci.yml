name: Verify
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements-dev.txt
      - run: npm install --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high
      - run: npm run build --prefix frontend
      - run: python -m pytest --junitxml=evidence/pytest.xml
      - run: python -m compileall -q backend/app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: evidence/pytest.xml
  langgraph-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements-dev.txt 'langgraph==0.6.11' 'langchain-core>=0.3.75,<0.4'
      - run: python -m pytest backend/tests/test_integrations.py -k langgraph
